data:
  data_dir: project_data
  train_csv: train_data.csv
  superclass_mapping: superclass_mapping.csv
  subclass_mapping: subclass_mapping.csv
  train_images_dir: train_images
  test_images_dir: test_images
  batch_size: 64
  num_workers: 8
  pin_memory: true
  train_seen_ratio: 0.75
  oe_subclasses_per_super: 2
  unseen_val_subclasses_per_super: 2
  image_size: 64

augmentation:
  randaugment_n: 2
  randaugment_m: 9
  randaugment_m_fallback: 7
  color_jitter_brightness: 0.3
  color_jitter_contrast: 0.3
  color_jitter_saturation: 0.3
  color_jitter_hue: 0.1
  random_crop_scale: [0.7, 1.0]
  random_crop_ratio: [0.8, 1.2]
  random_erasing_prob: 0.3
  random_erasing_scale: [0.02, 0.2]
  mixup_alpha: 0.2
  cutmix_alpha: 1.0
  mix_prob: 0.5
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

model:
  backbone: resnet34
  pretrained: true
  num_superclasses: 3
  num_subclasses: 87
  cosine_scale: 16.0
  virtual_logit_alpha_init: 0.0
  virtual_logit_beta_init: 3.0
  virtual_logit_clamp: 15.0
  dropout: 0.5

training:
  epochs: 30
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.05
  scheduler: cosine
  warmup_epochs: 3
  min_lr: 0.000001
  phase1_epochs: 5
  phase2_epochs: 15
  phase3_epochs: 10
  phase1_lr: 0.001
  phase2_lr: 0.0001
  phase3_lr: 0.00001
  grad_clip: 1.0
  early_stopping_patience: 12
  seed: 42

loss:
  label_smoothing: 0.1
  lambda_super: 1.0
  lambda_sub: 1.0
  lambda_oe: 2.0
  oe_batch_ratio: 0.25
  use_margin_loss: true
  margin: 3.0
  lambda_margin: 1.0

inference:
  temperature: 1.0
  temperature_search_range: [0.5, 2.5]
  temperature_search_steps: 21
  threshold_super: 0.5
  threshold_sub: 0.5
  threshold_search_range: [0.01, 0.9]
  threshold_search_steps: 41
  use_msp: true
  msp_threshold_sub: 0.5

logging:
  project_name: nndl-hierarchical-classification
  experiment_name: null
  log_every_n_steps: 10
  val_every_n_epochs: 1
  save_dir: experiments
  save_top_k: 3
